name: test
on: [push, pull_request]
# Tests only need to read the code.
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -W ignore -m unittest -v test_healthhub.py
